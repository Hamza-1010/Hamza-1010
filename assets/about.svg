<title>About: I study what neural networks learn, and how that knowledge moves between models. Right now I am testing whether a small model learns better when it is taught through a larger model’s interpretable features instead of its raw activations. Before this I studied how LLM personas revise their beliefs, and built explainable models for medical imaging.</title>
